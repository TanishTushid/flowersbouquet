<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>For You 💕</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Great+Vibes&family=Lato:wght@300;400&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

body{
  min-height:100vh;
  /* Soft floral-wallpaper background like in photo */
  background-color:#f0dce5;
  background-image:
    radial-gradient(ellipse at 20% 30%, rgba(230,170,190,.28) 0%, transparent 45%),
    radial-gradient(ellipse at 80% 70%, rgba(220,155,175,.22) 0%, transparent 45%),
    radial-gradient(ellipse at 50% 10%, rgba(245,210,220,.3)  0%, transparent 35%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  overflow-x:hidden;position:relative;font-family:'Lato',sans-serif;
}

/* tiny floral repeating pattern overlay */
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    radial-gradient(circle 4px at 10% 15%, rgba(200,120,150,.18) 0%, transparent 100%),
    radial-gradient(circle 3px at 30% 40%, rgba(210,130,155,.15) 0%, transparent 100%),
    radial-gradient(circle 5px at 60% 20%, rgba(200,120,150,.12) 0%, transparent 100%),
    radial-gradient(circle 3px at 80% 55%, rgba(215,135,160,.14) 0%, transparent 100%),
    radial-gradient(circle 4px at 15% 70%, rgba(205,125,148,.13) 0%, transparent 100%),
    radial-gradient(circle 3px at 90% 85%, rgba(210,130,155,.15) 0%, transparent 100%),
    radial-gradient(circle 4px at 45% 85%, rgba(200,120,150,.12) 0%, transparent 100%);
}

/* ─── OVERLAY ─── */
#overlay{
  position:fixed;inset:0;z-index:200;cursor:pointer;
  background:radial-gradient(ellipse at 50% 45%, #fde8ee 0%, #f8bbd0 50%, #f48fb1 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:opacity 1s ease, visibility 1s ease;
}
#overlay.gone{opacity:0;visibility:hidden;pointer-events:none;}
.ov-icon{font-size:5rem;animation:beat .75s ease-in-out infinite alternate;}
@keyframes beat{from{transform:scale(1);}to{transform:scale(1.2) rotate(-3deg);}}
.ov-title{font-family:'Great Vibes',cursive;font-size:2.5rem;color:#c2375a;margin-top:16px;text-align:center;}
.ov-sub{font-size:.8rem;letter-spacing:3px;text-transform:uppercase;color:#d4608a;margin-top:8px;opacity:.8;}

/* ─── FALLING PETALS ─── */
.fp{position:fixed;top:-20px;pointer-events:none;z-index:1;animation:fallP linear forwards;}
@keyframes fallP{0%{transform:translateY(0) rotate(0);opacity:.85;}100%{transform:translateY(108vh) rotate(540deg);opacity:0;}}

/* ─── FLOATING HEARTS ─── */
.fh{position:fixed;pointer-events:none;z-index:1;bottom:-30px;animation:riseH linear forwards;}
@keyframes riseH{
  0%{transform:translateY(0) scale(1);opacity:.7;}
  15%{opacity:.65;}85%{opacity:.35;}
  100%{transform:translateY(-108vh) scale(.5) rotate(15deg);opacity:0;}
}

/* ─── CARD ─── */
.card{position:relative;z-index:10;display:flex;flex-direction:column;align-items:center;
  animation:riseCard 1.3s cubic-bezier(.22,1,.36,1) both;}
@keyframes riseCard{from{opacity:0;transform:translateY(55px);}to{opacity:1;transform:translateY(0);}}

#bsvg{overflow:visible;cursor:pointer;
  filter:drop-shadow(0 28px 55px rgba(120,60,80,.22)) drop-shadow(0 8px 22px rgba(150,80,100,.16));}

/* ─── MESSAGE ─── */
.msg-wrap{text-align:center;padding:20px 32px 28px;max-width:500px;position:relative;}
.msg-wrap::before{
  content:'❝';position:absolute;top:4px;left:16px;
  font-family:serif;font-size:3rem;color:#c8547a;opacity:.18;line-height:1;
}
.msg-text{
  font-family:'Dancing Script',cursive;font-size:clamp(1.2rem,3.5vw,1.65rem);
  font-weight:700;color:#b8334e;line-height:1.75;
  text-shadow:0 1px 4px rgba(255,255,255,.7);
  animation:glow 3.5s ease-in-out infinite;
}
@keyframes glow{
  0%,100%{text-shadow:0 1px 4px rgba(255,255,255,.7);}
  50%{text-shadow:0 1px 4px rgba(255,255,255,.7),0 0 22px rgba(200,84,120,.2);}
}
.msg-from{margin-top:14px;font-family:'Great Vibes',cursive;font-size:1.3rem;color:#c4628a;opacity:.85;}
</style>
</head>
<body>

<div id="overlay">
  <div class="ov-icon">💝</div>
  <div class="ov-title">A little something for you…</div>
  <div class="ov-sub">tap to open</div>
</div>

<div class="card">
  <!--
    SVG portrait: 360 × 620
    ┌──────────────────────────────────┐
    │  FLOWERS  (y=10 … 298)           │
    │  Wide dome — salmon/cream/pink   │
    │  baby's breath scattered         │
    ├──────────────────────────────────┤
    │  STEMS (y=288 … 320)             │
    ├──────────────────────────────────┤
    │  KRAFT WRAPPER (y=305 … 570)     │
    │  Tall narrow cone                │
    │  Lace strip on left              │
    │  Jute-twine tie + heart charm    │
    └──────────────────────────────────┘
  -->
  <svg id="bsvg" width="360" height="590" viewBox="0 0 360 590"></svg>
  <div class="msg-wrap">
    <div class="msg-text" id="msgEl"></div>
    <div class="msg-from">— Tanish with all my love </div>
  </div>
</div>

<script>
const NS  = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('bsvg');
const defs = mkEl('defs'); svg.appendChild(defs);

function mkEl(tag,attrs={},parent=null){
  const e=document.createElementNS(NS,tag);
  for(const[k,v] of Object.entries(attrs)) e.setAttribute(k,v);
  if(parent) parent.appendChild(e);
  return e;
}
function grp(attrs={},parent=svg){return mkEl('g',attrs,parent);}
function rGrad(id,cx,cy,r,stops){
  const g=mkEl('radialGradient',{id,cx,cy,r,fx:cx,fy:cy,gradientUnits:'userSpaceOnUse'},defs);
  stops.forEach(([o,c,op=1])=>mkEl('stop',{'offset':o,'stop-color':c,'stop-opacity':op},g));
}
function lGrad(id,x1,y1,x2,y2,stops){
  const g=mkEl('linearGradient',{id,x1,y1,x2,y2,gradientUnits:'userSpaceOnUse'},defs);
  stops.forEach(([o,c,op=1])=>mkEl('stop',{'offset':o,'stop-color':c,'stop-opacity':op},g));
}

/* ─── GRADIENTS ─── */
// Kraft wrapper (parchment/brown paper)
lGrad('kraft',85,305,275,305,
  [['0%','#e8d0a0'],['25%','#d8bc88'],['60%','#c8a870'],['100%','#b89058']]);
lGrad('kraftV',180,305,180,570,
  [['0%','#e0c890'],['50%','#ccb478'],['100%','#b89058']]);
// Lace strip
lGrad('laceG',110,305,135,570,
  [['0%','rgba(255,252,248,.75)'],['100%','rgba(255,252,248,.55)']]);
// Left fold (back of paper)
lGrad('foldL',85,260,135,310,
  [['0%','#d4aa72'],['100%','#c09858']]);
// Right fold
lGrad('foldR',275,260,225,310,
  [['0%','#e0c078'],['100%','#caaa60']]);
// Jute twine
lGrad('juteG',140,545,220,545,
  [['0%','#b8922c'],['50%','#8b6914'],['100%','#a07820']]);
// Leaf
lGrad('leafG',0,-12,0,12,
  [['0%','#80b858'],['100%','#4a7a30']]);
// Leaf dark
lGrad('leafD',0,-12,0,12,
  [['0%','#6a9e48'],['100%','#3a6a20']]);

/* ═══════════════════════════════════════
   DRAW FUNCTIONS
═══════════════════════════════════════ */

/* ── ROSE (natural, multi-layer) ── */
function rose(parent,cx,cy,R,cols,rot=0,uid=''){
  const g=mkEl('g',{transform:`translate(${cx},${cy}) rotate(${rot})`},parent);
  rGrad('ro'+uid,0,0,R*.65,[['0%',cols[0]],['100%',cols[1]]]);
  rGrad('rm'+uid,0,0,R*.45,[['0%',cols[1]],['100%',cols[2]]]);
  rGrad('ri'+uid,0,0,R*.27,[['0%',cols[2]],['100%',cols[3]]]);
  // Outer 6 petals
  for(let i=0;i<6;i++){
    const a=(i/6)*360,r=a*Math.PI/180;
    const px=Math.cos(r)*R*.50,py=Math.sin(r)*R*.50;
    mkEl('ellipse',{cx:px,cy:py,rx:R*.30,ry:R*.52,
      transform:`rotate(${a+90},${px},${py})`,fill:`url(#ro${uid})`,opacity:.80},g);
  }
  // Middle 7 petals offset
  for(let i=0;i<7;i++){
    const a=(i/7)*360+24,r=a*Math.PI/180;
    const px=Math.cos(r)*R*.34,py=Math.sin(r)*R*.34;
    mkEl('ellipse',{cx:px,cy:py,rx:R*.22,ry:R*.40,
      transform:`rotate(${a+90},${px},${py})`,fill:`url(#rm${uid})`,opacity:.87},g);
  }
  // Inner 5 petals
  for(let i=0;i<5;i++){
    const a=(i/5)*360,r=a*Math.PI/180;
    const px=Math.cos(r)*R*.19,py=Math.sin(r)*R*.19;
    mkEl('ellipse',{cx:px,cy:py,rx:R*.13,ry:R*.26,
      transform:`rotate(${a+90},${px},${py})`,fill:`url(#ri${uid})`,opacity:.93},g);
  }
  // Center bud
  mkEl('circle',{cx:0,cy:0,r:R*.10,fill:cols[3]},g);
  // Shine
  mkEl('ellipse',{cx:-R*.09,cy:-R*.10,rx:R*.12,ry:R*.08,
    fill:'rgba(255,255,255,.40)',transform:'rotate(-35)'},g);
  return g;
}

/* ── SMALL BUD / TIGHT ROSE ── */
function bud(parent,cx,cy,R,cols,rot=0,uid=''){
  const g=mkEl('g',{transform:`translate(${cx},${cy}) rotate(${rot})`},parent);
  rGrad('bd'+uid,0,0,R*.6,[['0%',cols[0]],['100%',cols[1]]]);
  // 5 petals only (tight, not fully open)
  for(let i=0;i<5;i++){
    const a=(i/5)*360,r=a*Math.PI/180;
    const px=Math.cos(r)*R*.40,py=Math.sin(r)*R*.40;
    mkEl('ellipse',{cx:px,cy:py,rx:R*.24,ry:R*.44,
      transform:`rotate(${a+90},${px},${py})`,fill:`url(#bd${uid})`,opacity:.85},g);
  }
  mkEl('circle',{cx:0,cy:0,r:R*.16,fill:cols[1]},g);
  mkEl('ellipse',{cx:-R*.06,cy:-R*.07,rx:R*.08,ry:R*.06,fill:'rgba(255,255,255,.38)'},g);
  return g;
}

/* ── BABY'S BREATH ── */
function babyBreath(parent,cx,cy,spread=35,count=5){
  const g=mkEl('g',{transform:`translate(${cx},${cy})`},parent);
  function branch(px,py,depth,angle,len){
    if(depth<=0||len<4) return;
    const r=angle*Math.PI/180;
    const ex=px+Math.cos(r)*len, ey=py+Math.sin(r)*len;
    mkEl('line',{x1:px,y1:py,x2:ex,y2:ey,stroke:'#8aba68','stroke-width':0.8,opacity:.65},g);
    if(depth===1){
      // tiny flower at tip
      for(let i=0;i<5;i++){
        const fa=(i/5)*360,fr=fa*Math.PI/180;
        mkEl('ellipse',{cx:ex+Math.cos(fr)*2.5,cy:ey+Math.sin(fr)*2.5,
          rx:1.2,ry:2.2,transform:`rotate(${fa+90},${ex+Math.cos(fr)*2.5},${ey+Math.sin(fr)*2.5})`,
          fill:'#ffffff',opacity:.88},g);
      }
      mkEl('circle',{cx:ex,cy:ey,r:1.5,fill:'#fffacd'},g);
    } else {
      branch(ex,ey,depth-1,angle-28,len*.68);
      branch(ex,ey,depth-1,angle+28,len*.68);
    }
  }
  for(let i=0;i<count;i++){
    const a=(i/count)*360+(Math.random()*30-15);
    branch(0,0,3,a,spread*(0.6+Math.random()*.4));
  }
  return g;
}

/* ── SMALL STAR ACCENT FLOWER (hot pink) ── */
function starFlower(parent,cx,cy,R,pCol,cCol,rot=0){
  const g=mkEl('g',{transform:`translate(${cx},${cy}) rotate(${rot})`},parent);
  for(let i=0;i<5;i++){
    const a=(i/5)*360,r=a*Math.PI/180;
    const px=Math.cos(r)*R*.55,py=Math.sin(r)*R*.55;
    mkEl('ellipse',{cx:px,cy:py,rx:R*.18,ry:R*.44,
      transform:`rotate(${a+90},${px},${py})`,fill:pCol,opacity:.9},g);
  }
  mkEl('circle',{cx:0,cy:0,r:R*.22,fill:cCol},g);
  mkEl('circle',{cx:-R*.05,cy:-R*.06,r:R*.07,fill:'rgba(255,255,255,.5)'},g);
  return g;
}

/* ── LEAF ── */
function leaf(parent,cx,cy,w,h,rot,grad='leafG'){
  const g=mkEl('g',{transform:`translate(${cx},${cy}) rotate(${rot})`},parent);
  mkEl('ellipse',{cx:0,cy:0,rx:w/2,ry:h/2,fill:`url(#${grad})`},g);
  mkEl('line',{x1:0,y1:-h/2*.85,x2:0,y2:h/2*.85,stroke:'#3a6a20','stroke-width':.9,opacity:.4},g);
  mkEl('ellipse',{cx:-w*.08,cy:-h*.1,rx:w*.12,ry:h*.2,fill:'rgba(255,255,255,.18)'},g);
  return g;
}

/* ── LACE SCALLOP STRIP ── */
function laceStrip(parent,x1,y1,x2,y2,w=18){
  const g=mkEl('g',parent);
  // background strip
  mkEl('path',{d:`M${x1-w/2},${y1} L${x1+w/2},${y1} L${x2+w/2},${y2} L${x2-w/2},${y2}Z`,
    fill:'url(#laceG)'},g);
  // scallop pattern along left edge
  const steps=16, len=y2-y1, step=len/steps;
  for(let i=0;i<steps;i++){
    const sy=y1+i*step+step/2;
    mkEl('circle',{cx:x1-w/2+4,cy:sy,r:step/2*.85,
      fill:'none',stroke:'rgba(255,255,255,.5)','stroke-width':.8},g);
  }
  // tiny dots on right edge
  for(let i=0;i<steps*2;i++){
    mkEl('circle',{cx:x1+w/2-3,cy:y1+i*(len/(steps*2))+3,r:1,fill:'rgba(255,255,255,.45)'},g);
  }
  return g;
}

/* ═══════════════════════════════════════
   BUILD SCENE
═══════════════════════════════════════ */

/* 1. Background hearts */
const bgG=grp({id:'bg'});
[[30,45,14,'#f48fb1',.45],[328,38,18,'#f06292',.38],
 [15,170,9,'#fce4ec',.52],[345,150,11,'#f8bbd0',.42],
 [18,350,15,'#f48fb1',.38],[342,330,10,'#f06292',.33],
 [45,490,8,'#fce4ec',.30],[320,470,9,'#f8bbd0',.30],
 [180,18,7,'#f48fb1',.28],[85,545,6,'#f06292',.25],[278,540,7,'#f8bbd0',.25],
].forEach(([x,y,s,c,o])=>{
  const g=mkEl('g',{transform:`translate(${x},${y})`,opacity:o},bgG);
  mkEl('path',{d:`M0,${s*.4} C0,0 ${-s},0 ${-s},${-s*.3} C${-s},${-s*.8} 0,${-s*.9} 0,${-s*.5} C0,${-s*.9} ${s},${-s*.8} ${s},${-s*.3} C${s},0 0,0 0,${s*.4}Z`,fill:c},g);
});

/* 2. Stems (thin, elegant green curves) */
const stemG=grp({id:'stems'});
[
  {x1:180,y1:320,cpx:172,cpy:302,x2:168,y2:288},
  {x1:180,y1:320,cpx:165,cpy:298,x2:148,y2:282},
  {x1:180,y1:320,cpx:178,cpy:298,x2:180,y2:278},
  {x1:180,y1:320,cpx:192,cpy:300,x2:200,y2:282},
  {x1:180,y1:320,cpx:200,cpy:303,x2:215,y2:288},
  {x1:180,y1:320,cpx:152,cpy:306,x2:128,y2:295},
  {x1:180,y1:320,cpx:210,cpy:306,x2:238,y2:298},
].forEach(s=>{
  mkEl('path',{d:`M${s.x1},${s.y1} Q${s.cpx},${s.cpy} ${s.x2},${s.y2}`,
    stroke:'#5a8840','stroke-width':3.8,fill:'none','stroke-linecap':'round'},stemG);
});

/* 3. KRAFT WRAPPER
   Top:    y=308, x=82…278  (196px wide) — flowers emerge here
   Bottom: y=560, x=148…212 ( 64px wide) — tapers to narrow base = BOUQUET not pot
*/
const wrapG=grp({id:'wrapper'});
// Main paper body
mkEl('path',{d:'M 82,308 L 278,308 L 212,560 L 148,560 Z',fill:'url(#kraftV)'},wrapG);
// Left tonal variation
mkEl('path',{d:'M 82,308 L 120,308 L 165,560 L 148,560 Z',fill:'rgba(255,240,200,.18)'},wrapG);
// Right shadow edge
mkEl('path',{d:'M 252,308 L 278,308 L 212,560 L 202,560 Z',fill:'rgba(100,60,20,.12)'},wrapG);
// Left fold flap (top-left corner folded diagonally inward)
mkEl('path',{d:'M 82,308 L 82,268 L 142,308 Z',fill:'url(#foldL)',opacity:.88},wrapG);
// Right fold flap
mkEl('path',{d:'M 278,308 L 278,268 L 218,308 Z',fill:'url(#foldR)',opacity:.88},wrapG);
// Fold crease lines (subtle)
mkEl('line',{x1:82,y1:268,x2:142,y2:308,stroke:'rgba(160,120,60,.3)','stroke-width':1},wrapG);
mkEl('line',{x1:278,y1:268,x2:218,y2:308,stroke:'rgba(220,190,120,.3)','stroke-width':1},wrapG);
// Bottom crease line
mkEl('line',{x1:82,y1:308,x2:278,y2:308,stroke:'rgba(200,170,100,.4)','stroke-width':1.2},wrapG);
// Subtle vertical crease center
mkEl('line',{x1:180,y1:310,x2:180,y2:558,stroke:'rgba(200,170,100,.12)','stroke-width':1},wrapG);

// Lace strip (runs along left-center fold line)
laceStrip(wrapG, 118,310, 162,558, 16);

/* 4. JUTE/TWINE TIE (at bottom of wrapper, y≈535) */
const twineG=grp({id:'twine',transform:'translate(180,535)'});
// Main twine band
mkEl('rect',{x:-38,y:-7,width:76,height:14,rx:7,fill:'url(#juteG)'},twineG);
// Twine texture lines
for(let i=-34;i<36;i+=4){
  mkEl('line',{x1:i,y1:-7,x2:i+2,y2:7,stroke:'rgba(255,220,100,.2)','stroke-width':.8},twineG);
}
// Knot center
mkEl('ellipse',{cx:0,cy:0,rx:9,ry:8,fill:'#8b6914'},twineG);
mkEl('ellipse',{cx:-2,cy:-2,rx:3.5,ry:2.5,fill:'rgba(255,220,100,.3)'},twineG);
// Small burlap loops
mkEl('path',{d:'M -8,0 C -18,-18 -30,-18 -28,-8 C -26,2 -14,2 -8,0 Z',fill:'#9a7820',opacity:.85},twineG);
mkEl('path',{d:'M 8,0 C 18,-18 30,-18 28,-8 C 26,2 14,2 8,0 Z',fill:'#8b6914',opacity:.85},twineG);
// Small heart charm below twine
const hcx=0, hcy=18, hs=9;
const hrtG=mkEl('g',{transform:`translate(${hcx},${hcy})`},twineG);
mkEl('path',{
  d:`M0,${hs*.42} C0,0 ${-hs},0 ${-hs},${-hs*.28} C${-hs},${-hs*.78} 0,${-hs*.88} 0,${-hs*.48} C0,${-hs*.88} ${hs},${-hs*.78} ${hs},${-hs*.28} C${hs},0 0,0 0,${hs*.42}Z`,
  fill:'#c2375a'
},hrtG);
mkEl('ellipse',{cx:-hs*.16,cy:-hs*.26,rx:hs*.16,ry:hs*.12,fill:'rgba(255,255,255,.38)'},hrtG);

/* 5. Leaves (around wrapper top edges, peek out naturally) */
const leafG2=grp({id:'leaves'});
leaf(leafG2,108,296,52,27,-42);
leaf(leafG2,128,285,44,23,-26);
leaf(leafG2,252,296,52,27, 42);
leaf(leafG2,234,285,44,23, 26);
leaf(leafG2,180,282,40,22,  0);
leaf(leafG2, 90,308,48,24,-55,'leafD');
leaf(leafG2,272,308,48,24, 55,'leafD');

/* 6. FLOWERS — matching reference photo
   Large salmon/coral roses are the HEROES
   Cream roses add elegance
   Deep pink buds add depth
   Baby's breath adds airiness
   Small hot pink stars as accents
*/
const fG=grp({id:'flowers'});

// ── Baby's breath (BEHIND roses, scattered)
babyBreath(fG,155,95, 42,6);
babyBreath(fG,218,88, 38,5);
babyBreath(fG, 90,155,34,5);
babyBreath(fG,272,160,32,4);
babyBreath(fG,130,235,28,4);
babyBreath(fG,240,240,28,4);
babyBreath(fG,180,68, 30,4);
babyBreath(fG, 72,210,26,3);
babyBreath(fG,295,215,26,3);

// ── Small hot-pink star accent flowers ──
starFlower(fG,162, 88,13,'#e8205a','#ffd0e0', 10);
starFlower(fG,205, 78,12,'#d01850','#ffe0ea', -15);
starFlower(fG, 84,178,11,'#e8205a','#ffd0e0', 20);
starFlower(fG,282,172,11,'#d01850','#ffe0ea',  0);
starFlower(fG,132,260,10,'#e8307a','#ffc8d8', -10);
starFlower(fG,240,258,10,'#d82870','#ffd0e0',  15);
starFlower(fG,180,56, 11,'#e8205a','#ffd0e0',  5);

// ── Small deep-pink buds ──
bud(fG,108,178,26,['#f48fb1','#e8547a','#c2375a','#a01840'],-22,'pb1');
bud(fG,265,185,24,['#f48fb1','#e85080','#c2375a','#a01840'], 20,'pb2');

const msg='Every flower here bloomed the way my heart does, every single time I think of you. 💖';
const msgEl=document.getElementById('msgEl');
let mi=0;
function typeMsg(){if(mi<msg.length){msgEl.textContent+=msg[mi++];setTimeout(typeMsg,mi<4?240:37);}}

/* ═══════════════════════════════════════
   AMBIENT HEARTS & PETALS
═══════════════════════════════════════ */
const hC=['#f48fb1','#f06292','#e91e63','#fce4ec','#f8bbd0'];
function spawnHeart(){
  const d=document.createElement('div'); d.className='fh'; d.innerHTML='❤';
  d.style.cssText=`left:${Math.random()*100}%;font-size:${9+Math.random()*20}px;
    color:${hC[~~(Math.random()*hC.length)]};animation-duration:${5+Math.random()*6}s;`;
  document.body.appendChild(d); setTimeout(()=>d.remove(),13000);
}
const pC=['#f8c8b0','#fde8ee','#f48fb1','#fffaf5','#f9c0cc'];
function spawnPetal(){
  const d=document.createElement('div'); d.className='fp';
  const sz=6+Math.random()*9;
  d.style.cssText=`left:${Math.random()*100}%;width:${sz}px;height:${sz}px;
    background:${pC[~~(Math.random()*pC.length)]};
    border-radius:${Math.random()>.5?'50% 0 50% 0':'50%'};
    animation-duration:${4+Math.random()*5}s;opacity:.85;`;
  document.body.appendChild(d); setTimeout(()=>d.remove(),12000);
}
setInterval(spawnHeart,1400); setInterval(spawnPetal,1100);

document.getElementById('bsvg').addEventListener('click',()=>{
  for(let i=0;i<10;i++) setTimeout(spawnHeart,i*60);
  for(let i=0;i<7;i++)  setTimeout(spawnPetal,i*50);
});
